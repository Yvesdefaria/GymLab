<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#D9B384" />
    <meta
      name="description"
      content="GymLab — rutinas, seguimiento de entrenos, papers y calculadoras de fitness"
    />
    <title>GymLab</title>
    <script>
      (function () {
        var root = document.documentElement
        var palettes = ['gold', 'energy', 'crimson', 'electric', 'violet']
        var savedPalette = localStorage.getItem('gymlab.palette')
        root.dataset.palette = palettes.indexOf(savedPalette) !== -1 ? savedPalette : 'gold'
        root.dataset.theme =
          localStorage.getItem('gymlab.theme') === 'day' ? 'day' : 'night'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
