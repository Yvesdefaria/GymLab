<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#D9B384" />
    <meta
      name="description"
      content="GymLab: log sets, reps and weight, keep your streak and improve your marks. Train better with data."
    />
    <title>GymLab — Train better with data</title>
    <!-- The marketing site at https://gymlab.dev owns the indexable surface. This
         app has no crawlable content and would only compete with it. -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="canonical" href="https://app.gymlab.dev/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GymLab" />
    <meta property="og:title" content="GymLab — Train better with data" />
    <meta
      property="og:description"
      content="GymLab: log sets, reps and weight, keep your streak and improve your marks. Train better with data."
    />
    <meta property="og:url" content="https://app.gymlab.dev/" />
    <meta property="og:image" content="https://app.gymlab.dev/logo.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="1200" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GymLab — Train better with data" />
    <meta
      name="twitter:description"
      content="Workouts, training tracking and evidence-based fitness calculators."
    />
    <meta name="twitter:image" content="https://app.gymlab.dev/logo.jpg" />
    <!-- Anti-flash: aplica paleta y tema guardados antes del primer paint. -->
    <script>
      (function () {
        var root = document.documentElement
        var palettes = ['gold', 'energy', 'crimson', 'electric', 'violet', 'gray']
        var savedPalette = localStorage.getItem('gymlab.palette')
        root.dataset.palette = palettes.indexOf(savedPalette) !== -1 ? savedPalette : 'gold'
        root.dataset.theme =
          localStorage.getItem('gymlab.theme') === 'day' ? 'day' : 'night'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
