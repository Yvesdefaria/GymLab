<!doctype html>
<html lang="es">

  <body>
    <header>
      <a href="../index.html">
        <img src="../images/Logo.jpg" alt="logo de la web" />
      </a>

      <!-- Botón hamburguesa -->
      <button class="hamburguesa" id="btn-abrir" aria-label="Abrir menú">
        <img src="../images/ic_sharp-menu.svg" alt="menu" />
      </button>

      <!-- Menú lateral -->
      <nav class="menu-lateral" id="menu-lateral">
        <button class="btn-cerrar" id="btn-cerrar" aria-label="Cerrar menú">
          <img src="../images/mingcute_close-fill.png" alt="boton de cerrar" />
        </button>
        <ul>
          <li><a href="../pages/Progreso.html">Progreso</a></li>
          <li><a href="../pages/Rutinas.html">Rutinas</a></li>
          <li><a href="../pages/Entrenadores.html">Entrenador Personal</a></li>
          <li><a href="../pages/Blog.html">Blog</a></li>
          <li><a href="../pages/Planes.html">Planes</a></li>
        </ul>
        <div class="opciones-usuario">
          <div class="opcion-usuario">
            <img src="../images/streamline_logout-1.svg" alt="login" />
            <a href="../pages/Login.html">Cerrar Sesion</a>
          </div>
          <div class="opcion-usuario">
            <img
              src="../images/atencion-cliente-icono.svg"
              alt="atencionCliente"
            />
            <a href="#">Atencion al cliente</a>
          </div>
        </div>
        <div class="redes-sociales">
          <img src="../images/lucide_instagram.svg" alt="instagram" />
          <img src="../images/garden_facebook-stroke-12.svg" alt="facebook" />
          <img src="../images/iconoir_tiktok.svg" alt="tiktok" />
          <img src="../images/mingcute_pinterest-line.svg" alt="pinterest" />
        </div>
      </nav>

      <!-- Overlay oscuro detrás del menú -->
      <div id="overlay"></div>
    </header>
    <main>
     <form class="login-form">
  <h2>Iniciar sesión</h2>
  <p>
    ¿Nuevo por aqui? <a href="../pages/Registro.html">Crear nueva cuenta</a>
  </p>

  <div class="form-group">
    <input type="email" id="email" placeholder="Email" required>
  </div>

  <div class="form-group">
    <input type="password" id="password" placeholder="Contraseña" required>
    <img 
    src="../images/weui_eyes-on-filled.svg" 
    alt="Mostrar contraseña"
    class="toggle-password"
  >
  </div>

  <div class="form-footer">
    <button type="submit">Inicio de sesion</button>
    <p><a href="">Olvide mi contraseña</a></p>
  </div>
</form>
    </main>
    <footer>
      <div>
        <p><a href="#">Declaracion de Privacidad</a></p>
        <p><a href="#">Politica de cookies</a></p>

      </div>
      <p><a href="#">Copyright 2025 - GymLab</a></p>
    </footer>
    <script src="../javascript/jquery-4.0.0.slim.min.js"></script>
    <script src="../javascript/menu-lateral.js"></script>
    <script src="../javascript/hovers.js"></script>

</html>
